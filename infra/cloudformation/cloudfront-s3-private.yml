AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 + CloudFront static hosting and application API for SozoRock AI Lab.

Parameters:
  SiteBucketName:
    Type: String
    Description: Globally unique S3 bucket name for static site assets.
  DomainName:
    Type: String
    Default: ''
    Description: Optional custom domain, e.g. ai-lab.sozorockfoundation.org.
  CertificateArn:
    Type: String
    Default: ''
    Description: Optional ACM certificate ARN in us-east-1 for the custom domain.
  HostedZoneId:
    Type: String
    Default: ''
    Description: Optional Route 53 hosted zone ID for creating DNS alias.
  SenderEmail:
    Type: String
    Default: contact@sozorockfoundation.org
    Description: Verified SES sender email address.
  InternalNotificationEmail:
    Type: String
    Default: contact@sozorockfoundation.org
    Description: Internal recipient for new AI Lab interest notifications.
  FullApplicationUrl:
    Type: String
    Default: ''
    Description: Optional full application URL sent through the protected selected-applicant endpoint.
  AdminApiSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: Optional shared secret for POST /api/applications/selected.
  AllowedOrigin:
    Type: String
    Default: https://ai-lab.sozorockfoundation.org
    Description: Browser origin allowed to call the applications API.

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, '']]
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  HasHostedZone: !And [!Condition HasDomain, !Not [!Equals [!Ref HostedZoneId, '']]]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref SiteBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  ApplicationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  ApplicationsFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: applications-function-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt ApplicationsTable.Arn
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'

  ApplicationsFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt ApplicationsFunctionRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref ApplicationsTable
          SENDER_EMAIL: !Ref SenderEmail
          INTERNAL_EMAIL: !Ref InternalNotificationEmail
          FULL_APPLICATION_URL: !Ref FullApplicationUrl
          ADMIN_API_SECRET: !Ref AdminApiSecret
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Code:
        ZipFile: |
          const { DynamoDBClient, PutItemCommand } = require('@aws-sdk/client-dynamodb');
          const { SESClient, SendEmailCommand } = require('@aws-sdk/client-ses');
          const crypto = require('crypto');
          const ddb = new DynamoDBClient({});
          const ses = new SESClient({});
          const allowedOrigin = process.env.ALLOWED_ORIGIN || 'https://ai-lab.sozorockfoundation.org';
          const headers = {
            'content-type': 'application/json',
            'access-control-allow-origin': allowedOrigin,
            'access-control-allow-methods': 'POST,OPTIONS',
            'access-control-allow-headers': 'content-type,x-admin-secret',
            'cache-control': 'no-store'
          };
          const ok = (body, statusCode = 200) => ({ statusCode, headers, body: JSON.stringify(body) });
          const text = (value, max = 4000) => String(value || '').trim().slice(0, max);
          const validEmail = email => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
          async function sendEmail(to, subject, body) {
            if (!process.env.SENDER_EMAIL || !validEmail(to)) return { ok: false, skipped: true };
            try {
              await ses.send(new SendEmailCommand({
                Source: process.env.SENDER_EMAIL,
                Destination: { ToAddresses: [to] },
                Message: { Subject: { Data: subject }, Body: { Text: { Data: body } } }
              }));
              return { ok: true };
            } catch (error) {
              console.error('SES_SEND_FAILED', { to, message: error.message });
              return { ok: false, error: error.message };
            }
          }
          async function handleStart(body) {
            if (text(body.website, 200)) return ok({ ok: true });
            const firstName = text(body.firstName, 80);
            const lastName = text(body.lastName, 80);
            const email = text(body.email, 254).toLowerCase();
            const build = text(body.build, 2000);
            if (!firstName || !lastName || !validEmail(email) || !build || body.consent !== true) return ok({ error: 'Missing required fields.' }, 400);
            const id = `ailab-${Date.now()}-${crypto.randomBytes(4).toString('hex')}`;
            const submittedAt = new Date().toISOString();
            const ttl = Math.floor(Date.now() / 1000) + 60 * 60 * 24 * 365 * 2;
            await ddb.send(new PutItemCommand({
              TableName: process.env.TABLE_NAME,
              Item: {
                id: { S: id },
                type: { S: 'interest_start' },
                status: { S: 'submitted' },
                firstName: { S: firstName },
                lastName: { S: lastName },
                email: { S: email },
                build: { S: build },
                consent: { BOOL: true },
                source: { S: text(body.source, 100) || 'sozorock-ai-lab-website' },
                cohort: { S: text(body.cohort, 40) || 'next' },
                submittedAt: { S: submittedAt },
                ttl: { N: String(ttl) }
              }
            }));
            const applicantEmail = await sendEmail(email, 'We received your SozoRock AI Lab interest form', `Hi ${firstName},\n\nThank you for your interest in SozoRock AI Lab. We received your submission. Selected applicants will receive the full application and next steps by email.\n\nThe SozoRock Foundation Inc.`);
            let internalEmail = { ok: false, skipped: true };
            if (process.env.INTERNAL_EMAIL) {
              internalEmail = await sendEmail(process.env.INTERNAL_EMAIL, `New AI Lab interest: ${firstName} ${lastName}`, `New SozoRock AI Lab interest submission\n\nName: ${firstName} ${lastName}\nEmail: ${email}\nSubmission ID: ${id}\n\nWork to improve:\n${build}\n\nTo send the full application to a selected applicant, POST to /api/applications/selected with x-admin-secret and email, firstName, and optional applicationUrl.`);
            }
            return ok({ ok: true, id, email: { applicant: applicantEmail.ok === true, internal: internalEmail.ok === true } });
          }
          async function handleSelected(event, body) {
            const headerSecret = event.headers?.['x-admin-secret'] || event.headers?.['X-Admin-Secret'];
            if (!process.env.ADMIN_API_SECRET || headerSecret !== process.env.ADMIN_API_SECRET) return ok({ error: 'Unauthorized.' }, 401);
            const email = text(body.email, 254).toLowerCase();
            const firstName = text(body.firstName, 80) || 'there';
            const applicationUrl = text(body.applicationUrl, 2000) || text(process.env.FULL_APPLICATION_URL, 2000);
            if (!validEmail(email) || !applicationUrl) return ok({ error: 'Missing email or applicationUrl.' }, 400);
            const delivery = await sendEmail(email, 'Your SozoRock AI Lab full application', `Hi ${firstName},\n\nYou have been selected to complete the full SozoRock AI Lab application.\n\nFull application: ${applicationUrl}\n\nThe SozoRock Foundation Inc.`);
            if (!delivery.ok) return ok({ error: 'Email not sent.' }, 502);
            return ok({ ok: true });
          }
          exports.handler = async (event) => {
            if (event.requestContext?.http?.method === 'OPTIONS') return ok({ ok: true });
            let body = {};
            try { body = event.body ? JSON.parse(event.body) : {}; } catch (error) { return ok({ error: 'Invalid JSON.' }, 400); }
            const path = event.rawPath || event.requestContext?.http?.path || '';
            if (path.endsWith('/api/applications/start')) return handleStart(body);
            if (path.endsWith('/api/applications/selected')) return handleSelected(event, body);
            return ok({ error: 'Not found.' }, 404);
          };

  ApplicationsHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-applications-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type, x-admin-secret]
        MaxAge: 300

  ApplicationsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApplicationsHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApplicationsFunction.Arn
      PayloadFormatVersion: '2.0'

  ApplicationStartRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApplicationsHttpApi
      RouteKey: 'POST /api/applications/start'
      Target: !Sub 'integrations/${ApplicationsIntegration}'

  ApplicationSelectedRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApplicationsHttpApi
      RouteKey: 'POST /api/applications/selected'
      Target: !Sub 'integrations/${ApplicationsIntegration}'

  ApplicationsStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ApplicationsHttpApi
      StageName: '$default'
      AutoDeploy: true

  ApplicationsFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApplicationsFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApplicationsHttpApi}/*/*/api/applications/*'

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        Description: OAC for SozoRock AI Lab static site bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  UrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-url-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite extensionless static routes to index.html.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.indexOf('/api/') === 0) return request;
          if (uri.endsWith('/')) request.uri = uri + 'index.html';
          else if (uri.indexOf('.') === -1) request.uri = uri + '/index.html';
          return request;
        }

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://*.execute-api.*.amazonaws.com; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
              Override: true
            - Header: X-Permitted-Cross-Domain-Policies
              Value: "none"
              Override: true

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: SozoRock AI Lab static website and application API
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Aliases: !If
          - HasDomain
          - [!Ref DomainName]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCertificate
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: SiteBucketOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
          - Id: ApplicationsApiOrigin
            DomainName: !Sub '${ApplicationsHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApplicationsApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0
            ForwardedValues:
              QueryString: true
              Headers:
                - Origin
                - Access-Control-Request-Method
                - Access-Control-Request-Headers
                - Content-Type
                - Accept
                - X-Admin-Secret
              Cookies:
                Forward: none
        DefaultCacheBehavior:
          TargetOriginId: SiteBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlRewriteFunction.FunctionMetadata.FunctionARN
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref CloudFrontDistribution
  DistributionDomainName:
    Value: !GetAtt CloudFrontDistribution.DomainName
  CustomDomain:
    Value: !If [HasDomain, !Ref DomainName, '']
  ApplicationsApiEndpoint:
    Value: !Sub 'https://${ApplicationsHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  ApplicationsTableName:
    Value: !Ref ApplicationsTable
