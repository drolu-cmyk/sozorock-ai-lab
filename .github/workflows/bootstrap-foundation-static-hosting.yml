name: Bootstrap Foundation static hosting

on:
  issues:
    types: [opened]

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  bootstrap:
    if: >-
      github.repository == 'drolu-cmyk/sozorock-ai-lab' &&
      github.event.issue.user.login == 'drolu-cmyk' &&
      github.event.issue.title == 'bootstrap-foundation-static-hosting'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::791860731989:role/GitHubActionsSozorockAiLabDeployRole' }}
      ACCOUNT_ID: '791860731989'
      STACK_NAME: sozorock-foundation-parent-site
      DOMAIN_NAME: www.sozorockfoundation.org
      BUCKET_NAME: sozorock-foundation-parent-prod-791860731989
      CERTIFICATE_ARN: arn:aws:acm:us-east-1:791860731989:certificate/d2b11522-63cb-4c7f-b5a8-c0c25a39a2f7
      DEPLOY_ROLE_NAME: GitHubActionsSozorockFoundationSiteDeployRole
      EXPECTED_SUBJECT: repo:drolu-cmyk@271617784/sozorock-foundation@1337104562:ref:refs/heads/main
    steps:
      - name: Assume existing trusted SozoRock AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: FoundationStaticBootstrap-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Provision private S3 and CloudFront target stack
        id: infra
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT_ID"
          status="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)"
          if [ "$status" = "ROLLBACK_COMPLETE" ]; then
            aws cloudformation delete-stack --stack-name "$STACK_NAME"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
          fi
          cat >/tmp/parent-static-site.yml <<'YAML'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: Production static hosting target for www.sozorockfoundation.org using private S3 and CloudFront. The www alias is moved only after the target is verified.
          Parameters:
            DomainName: {Type: String}
            BucketName: {Type: String}
            CertificateArn: {Type: String}
          Resources:
            SiteBucket:
              Type: AWS::S3::Bucket
              Properties:
                BucketName: !Ref BucketName
                PublicAccessBlockConfiguration:
                  BlockPublicAcls: true
                  BlockPublicPolicy: true
                  IgnorePublicAcls: true
                  RestrictPublicBuckets: true
                BucketEncryption:
                  ServerSideEncryptionConfiguration:
                    - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
                VersioningConfiguration: {Status: Enabled}
                OwnershipControls:
                  Rules:
                    - ObjectOwnership: BucketOwnerEnforced
            OriginAccessControl:
              Type: AWS::CloudFront::OriginAccessControl
              Properties:
                OriginAccessControlConfig:
                  Name: sozorock-foundation-www-oac
                  Description: Private S3 origin access for the SozoRock Foundation parent site
                  OriginAccessControlOriginType: s3
                  SigningBehavior: always
                  SigningProtocol: sigv4
            CleanUrlFunction:
              Type: AWS::CloudFront::Function
              Properties:
                Name: sozorock-foundation-clean-urls
                AutoPublish: true
                FunctionConfig:
                  Comment: Rewrite clean routes to generated index.html files
                  Runtime: cloudfront-js-2.0
                FunctionCode: |
                  function handler(event) {
                    var request = event.request;
                    var uri = request.uri;
                    if (uri.endsWith('/')) request.uri = uri + 'index.html';
                    else if (!uri.split('/').pop().includes('.')) request.uri = uri + '/index.html';
                    return request;
                  }
            SecurityHeadersPolicy:
              Type: AWS::CloudFront::ResponseHeadersPolicy
              Properties:
                ResponseHeadersPolicyConfig:
                  Name: sozorock-foundation-security-headers
                  Comment: Security headers for the Foundation parent site
                  SecurityHeadersConfig:
                    ContentTypeOptions: {Override: true}
                    FrameOptions: {FrameOption: DENY, Override: true}
                    ReferrerPolicy: {ReferrerPolicy: strict-origin-when-cross-origin, Override: true}
                    StrictTransportSecurity:
                      AccessControlMaxAgeSec: 31536000
                      IncludeSubdomains: false
                      Preload: false
                      Override: true
                    XSSProtection: {Protection: true, ModeBlock: true, Override: true}
            Distribution:
              Type: AWS::CloudFront::Distribution
              Properties:
                DistributionConfig:
                  Enabled: true
                  Comment: The SozoRock Foundation parent website target
                  DefaultRootObject: index.html
                  HttpVersion: http2and3
                  IPV6Enabled: true
                  PriceClass: PriceClass_100
                  Origins:
                    - Id: site-bucket
                      DomainName: !GetAtt SiteBucket.RegionalDomainName
                      OriginAccessControlId: !GetAtt OriginAccessControl.Id
                      S3OriginConfig: {OriginAccessIdentity: ''}
                  DefaultCacheBehavior:
                    TargetOriginId: site-bucket
                    ViewerProtocolPolicy: redirect-to-https
                    AllowedMethods: [GET, HEAD, OPTIONS]
                    CachedMethods: [GET, HEAD]
                    Compress: true
                    CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
                    ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
                    FunctionAssociations:
                      - EventType: viewer-request
                        FunctionARN: !GetAtt CleanUrlFunction.FunctionARN
                  ViewerCertificate:
                    AcmCertificateArn: !Ref CertificateArn
                    SslSupportMethod: sni-only
                    MinimumProtocolVersion: TLSv1.2_2021
            SiteBucketPolicy:
              Type: AWS::S3::BucketPolicy
              Properties:
                Bucket: !Ref SiteBucket
                PolicyDocument:
                  Version: '2012-10-17'
                  Statement:
                    - Sid: AllowCloudFrontRead
                      Effect: Allow
                      Principal: {Service: cloudfront.amazonaws.com}
                      Action: s3:GetObject
                      Resource: !Sub '${SiteBucket.Arn}/*'
                      Condition:
                        StringEquals:
                          AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          Outputs:
            BucketName: {Value: !Ref SiteBucket}
            DistributionId: {Value: !Ref Distribution}
            DistributionDomainName: {Value: !GetAtt Distribution.DomainName}
          YAML
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file /tmp/parent-static-site.yml \
            --parameter-overrides DomainName="$DOMAIN_NAME" BucketName="$BUCKET_NAME" CertificateArn="$CERTIFICATE_ARN" \
            --no-fail-on-empty-changeset
          bucket="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs[?OutputKey==`BucketName`].OutputValue' --output text)"
          distribution="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs[?OutputKey==`DistributionId`].OutputValue' --output text)"
          distribution_domain="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs[?OutputKey==`DistributionDomainName`].OutputValue' --output text)"
          test "$bucket" = "$BUCKET_NAME"
          test -n "$distribution"
          test -n "$distribution_domain"
          printf 'bucket=%s\ndistribution=%s\ndistribution_domain=%s\n' "$bucket" "$distribution" "$distribution_domain" >> "$GITHUB_OUTPUT"

      - name: Create narrow Foundation repository deploy role
        shell: bash
        env:
          BUCKET: ${{ steps.infra.outputs.bucket }}
          DISTRIBUTION: ${{ steps.infra.outputs.distribution }}
        run: |
          set -euo pipefail
          provider="arn:aws:iam::${ACCOUNT_ID}:oidc-provider/token.actions.githubusercontent.com"
          cat >/tmp/trust.json <<EOF
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"${provider}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"token.actions.githubusercontent.com:aud":"sts.amazonaws.com","token.actions.githubusercontent.com:sub":"${EXPECTED_SUBJECT}"}}}]}
          EOF
          cat >/tmp/policy.json <<EOF
          {"Version":"2012-10-17","Statement":[
            {"Effect":"Allow","Action":["cloudformation:DescribeStacks"],"Resource":"*"},
            {"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":"arn:aws:s3:::${BUCKET}"},
            {"Effect":"Allow","Action":["s3:PutObject","s3:GetObject","s3:DeleteObject"],"Resource":"arn:aws:s3:::${BUCKET}/*"},
            {"Effect":"Allow","Action":["cloudfront:CreateInvalidation","cloudfront:GetInvalidation"],"Resource":"arn:aws:cloudfront::${ACCOUNT_ID}:distribution/${DISTRIBUTION}"}
          ]}
          EOF
          if aws iam get-role --role-name "$DEPLOY_ROLE_NAME" >/dev/null 2>&1; then
            aws iam update-assume-role-policy --role-name "$DEPLOY_ROLE_NAME" --policy-document file:///tmp/trust.json
          else
            aws iam create-role --role-name "$DEPLOY_ROLE_NAME" --description 'Deploys the SozoRock Foundation parent static site from GitHub' --max-session-duration 3600 --assume-role-policy-document file:///tmp/trust.json >/dev/null
          fi
          aws iam put-role-policy --role-name "$DEPLOY_ROLE_NAME" --policy-name SozoRockFoundationSiteDeploy --policy-document file:///tmp/policy.json

      - name: Publish bootstrap result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BUCKET: ${{ steps.infra.outputs.bucket }}
          DISTRIBUTION: ${{ steps.infra.outputs.distribution }}
          DISTRIBUTION_DOMAIN: ${{ steps.infra.outputs.distribution_domain }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Bootstrap: **success**\n\nStack: \`${STACK_NAME}\`\nBucket: \`${BUCKET}\`\nCloudFront target distribution: \`${DISTRIBUTION}\`\nCloudFront target domain: \`${DISTRIBUTION_DOMAIN}\`\nDeploy role: \`arn:aws:iam::${ACCOUNT_ID}:role/${DEPLOY_ROLE_NAME}\`\nCertificate: \`${CERTIFICATE_ARN}\`\n\nThe target was created without claiming \`www\`. No DNS cutover was performed."

  cutover:
    if: >-
      github.repository == 'drolu-cmyk/sozorock-ai-lab' &&
      github.event.issue.user.login == 'drolu-cmyk' &&
      github.event.issue.title == 'cutover-foundation-static-hosting'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::791860731989:role/GitHubActionsSozorockAiLabDeployRole' }}
      STACK_NAME: sozorock-foundation-parent-site
      HOSTED_ZONE_ID: Z07905293AANZWGYZ84F3
      WWW_NAME: www.sozorockfoundation.org.
    steps:
      - name: Assume existing trusted SozoRock AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: FoundationStaticCutover-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3
      - name: Verify CloudFront and cut over www atomically
        id: dns
        shell: bash
        run: |
          set -euo pipefail
          distribution_domain="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs[?OutputKey==`DistributionDomainName`].OutputValue' --output text)"
          test -n "$distribution_domain"
          page="$(curl -kfsSL --max-time 30 "https://${distribution_domain}/")"
          grep -Fq 'Access.' <<<"$page"
          grep -Fq 'Assurance.' <<<"$page"
          grep -Fq 'Intelligence.' <<<"$page"
          echo 'Domain association must be completed before DNS cutover.' >&2
          exit 1
