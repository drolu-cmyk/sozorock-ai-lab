name: Bootstrap Foundation DNS role

on:
  issues:
    types: [opened]

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  bootstrap:
    if: >-
      github.repository == 'drolu-cmyk/sozorock-ai-lab' &&
      github.event.issue.user.login == 'drolu-cmyk' &&
      github.event.issue.title == 'bootstrap-foundation-dns-role'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::791860731989:role/GitHubActionsSozorockAiLabDeployRole' }}
      ACCOUNT_ID: '791860731989'
      FOUNDATION_ROLE_NAME: GitHubActionsSozorockFoundationDnsRole
      FOUNDATION_POLICY_NAME: SozoRockFoundationParentDns
      ZONE_NAME: sozorockfoundation.org.
      EXPECTED_SUBJECT: repo:drolu-cmyk@271617784/sozorock-foundation@1337104562:ref:refs/heads/main
    steps:
      - name: Assume existing trusted SozoRock AWS deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: FoundationDnsBootstrap-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Reconcile dedicated Foundation DNS role only
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          caller_account="$(aws sts get-caller-identity --query Account --output text)"
          test "$caller_account" = "$ACCOUNT_ID"

          provider_arn="arn:aws:iam::${ACCOUNT_ID}:oidc-provider/token.actions.githubusercontent.com"
          provider_count="$(aws iam list-open-id-connect-providers --output json | jq --arg arn "$provider_arn" '[.OpenIDConnectProviderList[] | select(.Arn == $arn)] | length')"
          test "$provider_count" = "1"

          zone_json="$(aws route53 list-hosted-zones-by-name --dns-name "$ZONE_NAME" --output json)"
          mapfile -t zone_ids < <(jq -r --arg name "$ZONE_NAME" '.HostedZones[] | select(.Name == $name and .Config.PrivateZone == false) | .Id' <<<"$zone_json")
          test "${#zone_ids[@]}" -eq 1
          zone_id="${zone_ids[0]#/hostedzone/}"

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          trust_file="$workdir/trust.json"
          policy_file="$workdir/policy.json"

          jq -n --arg provider "$provider_arn" --arg subject "$EXPECTED_SUBJECT" '{
            Version:"2012-10-17",
            Statement:[{
              Sid:"AllowSozoRockFoundationMain",
              Effect:"Allow",
              Principal:{Federated:$provider},
              Action:"sts:AssumeRoleWithWebIdentity",
              Condition:{StringEquals:{
                "token.actions.githubusercontent.com:aud":"sts.amazonaws.com",
                "token.actions.githubusercontent.com:sub":$subject
              }}
            }]
          }' > "$trust_file"

          jq -n --arg zone_arn "arn:aws:route53:::hostedzone/${zone_id}" '{
            Version:"2012-10-17",
            Statement:[
              {Sid:"DiscoverPublicHostedZone",Effect:"Allow",Action:["route53:ListHostedZonesByName"],Resource:"*"},
              {Sid:"ReadTargetHostedZone",Effect:"Allow",Action:["route53:GetHostedZone","route53:ListResourceRecordSets"],Resource:$zone_arn},
              {Sid:"ChangeOnlyAuthorizedParentRecords",Effect:"Allow",Action:["route53:ChangeResourceRecordSets"],Resource:$zone_arn,Condition:{"ForAllValues:StringEquals":{
                "route53:ChangeResourceRecordSetsNormalizedRecordNames":["www.sozorockfoundation.org","_openai-site-verification.www.sozorockfoundation.org","_cf-custom-hostname.www.sozorockfoundation.org"],
                "route53:ChangeResourceRecordSetsRecordTypes":["CNAME","TXT"],
                "route53:ChangeResourceRecordSetsActions":["UPSERT"]
              }}},
              {Sid:"WaitForRoute53Change",Effect:"Allow",Action:["route53:GetChange"],Resource:"arn:aws:route53:::change/*"}
            ]
          }' > "$policy_file"

          if aws iam get-role --role-name "$FOUNDATION_ROLE_NAME" >/dev/null 2>&1; then
            aws iam update-assume-role-policy --role-name "$FOUNDATION_ROLE_NAME" --policy-document "file://${trust_file}"
          else
            aws iam create-role \
              --role-name "$FOUNDATION_ROLE_NAME" \
              --description "Least-privilege DNS automation for the SozoRock Foundation parent website" \
              --max-session-duration 3600 \
              --assume-role-policy-document "file://${trust_file}" >/dev/null
          fi

          aws iam put-role-policy \
            --role-name "$FOUNDATION_ROLE_NAME" \
            --policy-name "$FOUNDATION_POLICY_NAME" \
            --policy-document "file://${policy_file}"

          role_json="$(aws iam get-role --role-name "$FOUNDATION_ROLE_NAME" --output json)"
          actual_subject="$(jq -r '.Role.AssumeRolePolicyDocument.Statement[] | select(.Sid == "AllowSozoRockFoundationMain") | .Condition.StringEquals["token.actions.githubusercontent.com:sub"]' <<<"$role_json")"
          test "$actual_subject" = "$EXPECTED_SUBJECT"

          policy_json="$(aws iam get-role-policy --role-name "$FOUNDATION_ROLE_NAME" --policy-name "$FOUNDATION_POLICY_NAME" --output json)"
          jq -e --arg zone "arn:aws:route53:::hostedzone/${zone_id}" '
            .PolicyDocument.Statement[]
            | select(.Sid == "ChangeOnlyAuthorizedParentRecords")
            | .Resource == $zone
            and (.Condition["ForAllValues:StringEquals"]["route53:ChangeResourceRecordSetsNormalizedRecordNames"] | sort == ["_cf-custom-hostname.www.sozorockfoundation.org","_openai-site-verification.www.sozorockfoundation.org","www.sozorockfoundation.org"])
          ' <<<"$policy_json" >/dev/null

          printf 'role_arn=arn:aws:iam::%s:role/%s\n' "$ACCOUNT_ID" "$FOUNDATION_ROLE_NAME" >> "$GITHUB_OUTPUT"
          printf 'zone_id=%s\n' "$zone_id" >> "$GITHUB_OUTPUT"

      - name: Publish bootstrap result
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.repair.outcome }}
          ROLE_ARN: ${{ steps.repair.outputs.role_arn }}
          ZONE_ID: ${{ steps.repair.outputs.zone_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_SUBJECT: ${{ env.EXPECTED_SUBJECT }}
        shell: bash
        run: |
          set -euo pipefail
          body="Outcome: **${OUTCOME}**\n\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n\nAWS mutations were restricted to the dedicated Foundation DNS IAM role and its inline policy. No Route 53 records, AI Lab application resources, or subdomain resources were changed."
          if [[ "$OUTCOME" == "success" ]]; then
            body="${body}\n\nRole: \`${ROLE_ARN}\`\nHosted zone: \`${ZONE_ID}\`\nTrusted subject: \`${EXPECTED_SUBJECT}\`"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          test "$OUTCOME" = "success"
