name: Reconcile AI Lab trust for Foundation recovery

on:
  push:
    branches: [main]
    paths:
      - infra/iam/github-actions-oidc-trust-policy.json
      - .github/workflows/reconcile-own-foundation-trust.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: reconcile-own-foundation-trust
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ACCOUNT_ID: '791860731989'
  ROLE_NAME: GitHubActionsSozorockAiLabDeployRole
  RECOVERY_ISSUE: '76'

jobs:
  reconcile:
    if: github.repository == 'drolu-cmyk/sozorock-ai-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Validate exact reviewed trust contract
        shell: bash
        run: |
          set -euo pipefail
          policy='infra/iam/github-actions-oidc-trust-policy.json'
          jq -e '.Version == "2012-10-17" and (.Statement | length) == 1' "$policy" >/dev/null
          jq -e '.Statement[0].Action == "sts:AssumeRoleWithWebIdentity"' "$policy" >/dev/null
          jq -e '.Statement[0].Principal.Federated == "arn:aws:iam::791860731989:oidc-provider/token.actions.githubusercontent.com"' "$policy" >/dev/null
          actual="$(jq -c '.Statement[0].Condition.StringLike["token.actions.githubusercontent.com:sub"] | sort' "$policy")"
          expected='["repo:drolu-cmyk/sozorock-ai-lab:environment:production","repo:drolu-cmyk/sozorock-ai-lab:ref:refs/heads/main","repo:drolu-cmyk/sozorock-foundation:ref:refs/heads/main"]'
          test "$actual" = "$expected"

      - name: Assume AI Lab deployment role through main OIDC subject
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::791860731989:role/GitHubActionsSozorockAiLabDeployRole
          role-session-name: AI-Lab-Own-Trust-Reconcile-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Apply and verify own trust policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT_ID"
          caller="$(aws sts get-caller-identity --query Arn --output text)"
          [[ "$caller" == arn:aws:sts::${ACCOUNT_ID}:assumed-role/${ROLE_NAME}/* ]]

          aws iam get-role --role-name "$ROLE_NAME" >/dev/null
          aws iam update-assume-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-document file://infra/iam/github-actions-oidc-trust-policy.json

          expected="$(jq -c '.Statement[0].Condition.StringLike["token.actions.githubusercontent.com:sub"] | sort' infra/iam/github-actions-oidc-trust-policy.json)"
          actual="$(aws iam get-role --role-name "$ROLE_NAME" --output json | jq -c '.Role.AssumeRolePolicyDocument.Statement[] | select(.Action == "sts:AssumeRoleWithWebIdentity") | .Condition.StringLike["token.actions.githubusercontent.com:sub"] | sort')"
          test "$actual" = "$expected"
          echo 'AI Lab deployment trust now includes the exact Foundation main OIDC subject.' >> "$GITHUB_STEP_SUMMARY"

      - name: Record verified bridge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "$RECOVERY_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Verified temporary recovery bridge applied by run \`${GITHUB_RUN_ID}\`: \`GitHubActionsSozorockAiLabDeployRole\` now trusts the exact Foundation \`main\` OIDC subject in addition to the existing AI Lab production and main subjects. No service resource was changed."
