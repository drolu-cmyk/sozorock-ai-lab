name: Grant Foundation regional hosting permissions

on:
  issues:
    types: [opened]

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  grant:
    if: >-
      github.repository == 'drolu-cmyk/sozorock-ai-lab' &&
      github.event.issue.user.login == 'drolu-cmyk' &&
      github.event.issue.title == 'grant-foundation-cutover'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::791860731989:role/GitHubActionsSozorockAiLabDeployRole' }}
      ACCOUNT_ID: '791860731989'
      HOSTED_ZONE_ID: Z07905293AANZWGYZ84F3
      BUCKET_NAME: sozorock-foundation-parent-prod-791860731989
      DEPLOY_ROLE_NAME: GitHubActionsSozorockFoundationSiteDeployRole
      LAMBDA_ROLE_NAME: SozoRockFoundationParentLambdaRole
      CERTIFICATE_ARN: arn:aws:acm:us-east-1:791860731989:certificate/d2b11522-63cb-4c7f-b5a8-c0c25a39a2f7
      EXPECTED_SUBJECT: repo:drolu-cmyk@271617784/sozorock-foundation@1337104562:ref:refs/heads/main
    steps:
      - name: Assume existing trusted SozoRock AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: FoundationRegionalGrant-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Ensure API Gateway service-linked role
        shell: bash
        run: |
          set -euo pipefail
          if aws iam get-role --role-name AWSServiceRoleForAPIGateway >/dev/null 2>&1; then
            echo 'AWSServiceRoleForAPIGateway already exists.'
          else
            aws iam create-service-linked-role --aws-service-name ops.apigateway.amazonaws.com >/dev/null
            for attempt in {1..30}; do
              if aws iam get-role --role-name AWSServiceRoleForAPIGateway >/dev/null 2>&1; then
                echo 'AWSServiceRoleForAPIGateway created.'
                break
              fi
              sleep 2
            done
            aws iam get-role --role-name AWSServiceRoleForAPIGateway >/dev/null
          fi

      - name: Create Lambda execution role and Foundation deployment role
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT_ID"

          cat >/tmp/lambda-trust.json <<'EOF'
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":"sts:AssumeRole"}]}
          EOF
          if aws iam get-role --role-name "$LAMBDA_ROLE_NAME" >/dev/null 2>&1; then
            aws iam update-assume-role-policy --role-name "$LAMBDA_ROLE_NAME" --policy-document file:///tmp/lambda-trust.json
          else
            aws iam create-role --role-name "$LAMBDA_ROLE_NAME" --description 'Runtime role for the SozoRock Foundation parent site origin' --assume-role-policy-document file:///tmp/lambda-trust.json >/dev/null
          fi
          cat >/tmp/lambda-policy.json <<EOF
          {"Version":"2012-10-17","Statement":[
            {"Effect":"Allow","Action":["s3:GetObject"],"Resource":"arn:aws:s3:::${BUCKET_NAME}/*"},
            {"Effect":"Allow","Action":["logs:CreateLogGroup","logs:CreateLogStream","logs:PutLogEvents"],"Resource":"arn:aws:logs:${AWS_REGION}:${ACCOUNT_ID}:*"}
          ]}
          EOF
          aws iam put-role-policy --role-name "$LAMBDA_ROLE_NAME" --policy-name SozoRockFoundationParentOrigin --policy-document file:///tmp/lambda-policy.json

          provider="arn:aws:iam::${ACCOUNT_ID}:oidc-provider/token.actions.githubusercontent.com"
          cat >/tmp/deploy-trust.json <<EOF
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"${provider}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"token.actions.githubusercontent.com:aud":"sts.amazonaws.com","token.actions.githubusercontent.com:sub":"${EXPECTED_SUBJECT}"}}}]}
          EOF
          if aws iam get-role --role-name "$DEPLOY_ROLE_NAME" >/dev/null 2>&1; then
            aws iam update-assume-role-policy --role-name "$DEPLOY_ROLE_NAME" --policy-document file:///tmp/deploy-trust.json
          else
            aws iam create-role --role-name "$DEPLOY_ROLE_NAME" --description 'Deploys the SozoRock Foundation parent site from GitHub' --max-session-duration 3600 --assume-role-policy-document file:///tmp/deploy-trust.json >/dev/null
          fi

          cat >/tmp/deploy-policy.json <<EOF
          {"Version":"2012-10-17","Statement":[
            {"Effect":"Allow","Action":["cloudformation:CreateStack","cloudformation:UpdateStack","cloudformation:DescribeStacks","cloudformation:DescribeStackEvents","cloudformation:DescribeChangeSet","cloudformation:CreateChangeSet","cloudformation:ExecuteChangeSet","cloudformation:DeleteChangeSet","cloudformation:GetTemplate"],"Resource":["arn:aws:cloudformation:${AWS_REGION}:${ACCOUNT_ID}:stack/sozorock-foundation-parent-regional/*"]},
            {"Effect":"Allow","Action":["s3:CreateBucket","s3:GetBucketLocation","s3:GetBucketVersioning","s3:GetEncryptionConfiguration","s3:GetBucketPolicy","s3:GetBucketPublicAccessBlock","s3:GetBucketOwnershipControls","s3:PutBucketVersioning","s3:PutEncryptionConfiguration","s3:PutBucketPublicAccessBlock","s3:PutBucketOwnershipControls","s3:ListBucket"],"Resource":"arn:aws:s3:::${BUCKET_NAME}"},
            {"Effect":"Allow","Action":["s3:PutObject","s3:GetObject","s3:DeleteObject"],"Resource":"arn:aws:s3:::${BUCKET_NAME}/*"},
            {"Effect":"Allow","Action":["lambda:CreateFunction","lambda:GetFunction","lambda:GetFunctionConfiguration","lambda:UpdateFunctionCode","lambda:UpdateFunctionConfiguration","lambda:AddPermission","lambda:RemovePermission","lambda:DeleteFunction","lambda:TagResource","lambda:UntagResource"],"Resource":"arn:aws:lambda:${AWS_REGION}:${ACCOUNT_ID}:function:SozoRockFoundationParentOrigin"},
            {"Effect":"Allow","Action":["iam:PassRole"],"Resource":"arn:aws:iam::${ACCOUNT_ID}:role/${LAMBDA_ROLE_NAME}"},
            {"Effect":"Allow","Action":["apigateway:*"],"Resource":"arn:aws:apigateway:${AWS_REGION}::*"},
            {"Effect":"Allow","Action":["acm:DescribeCertificate","acm:GetCertificate","acm:ListTagsForCertificate"],"Resource":"${CERTIFICATE_ARN}"},
            {"Effect":"Allow","Action":["route53:ListResourceRecordSets","route53:ChangeResourceRecordSets"],"Resource":"arn:aws:route53:::hostedzone/${HOSTED_ZONE_ID}"},
            {"Effect":"Allow","Action":["route53:GetChange"],"Resource":"arn:aws:route53:::change/*"}
          ]}
          EOF
          aws iam put-role-policy --role-name "$DEPLOY_ROLE_NAME" --policy-name SozoRockFoundationSiteDeploy --policy-document file:///tmp/deploy-policy.json

      - name: Publish result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Foundation deployment prerequisites: **ready**\n\nAPI Gateway service-linked role: \`AWSServiceRoleForAPIGateway\`\nDeploy role: \`arn:aws:iam::${ACCOUNT_ID}:role/${DEPLOY_ROLE_NAME}\`\nLambda runtime role: \`arn:aws:iam::${ACCOUNT_ID}:role/${LAMBDA_ROLE_NAME}\`\n\nRegional recovery path is ready to deploy."
