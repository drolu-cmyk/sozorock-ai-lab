name: Diagnose Foundation regional validation

on:
  issues:
    types: [opened]

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  diagnose:
    if: >-
      github.repository == 'drolu-cmyk/sozorock-ai-lab' &&
      github.event.issue.user.login == 'drolu-cmyk' &&
      github.event.issue.title == 'diagnose-foundation-regional'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::791860731989:role/GitHubActionsSozorockAiLabDeployRole' }}
      STACK_NAME: sozorock-foundation-parent-regional
    steps:
      - name: Assume trusted AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: FoundationRegionalDiagnose-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Capture failed validation events
        id: diagnose
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation describe-events \
            --stack-name "$STACK_NAME" \
            --filters FailedEvents=true \
            --output json >/tmp/events.json
          jq -r '.OperationEvents[] | [(.ValidationName // .EventType // "event"), (.ValidationPath // ""), (.ValidationStatusReason // .ResourceStatusReason // .HookStatusReason // "") ] | @tsv' /tmp/events.json >/tmp/summary.txt
          if [ ! -s /tmp/summary.txt ]; then
            echo 'No failed events returned.' >/tmp/summary.txt
          fi
          {
            echo 'summary<<EOF'
            cat /tmp/summary.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SUMMARY: ${{ steps.diagnose.outputs.summary }}
        run: |
          printf 'CloudFormation validation diagnosis:\n\n```text\n%s\n```\n' "$SUMMARY" >/tmp/body.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
