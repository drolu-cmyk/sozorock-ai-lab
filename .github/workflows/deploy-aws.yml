name: Diagnose AWS deployment credentials
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  diagnose:
    if: github.head_ref == 'agent/diagnose-live-deploy'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Validate deployment secret presence
        run: |
          test -n "${{ secrets.AWS_ROLE_TO_ASSUME }}" || { echo 'AWS_ROLE_TO_ASSUME is missing'; exit 1; }
          echo 'AWS_ROLE_TO_ASSUME is configured'
      - name: Configure AWS credentials once
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          disable-retry: true
      - name: Confirm AWS identity
        run: aws sts get-caller-identity
