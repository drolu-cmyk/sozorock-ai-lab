name: Validate and deploy SozoRock AI Lab to AWS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: sozorock-ai-lab-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate policy pages
        run: npm run generate:legal
      - name: Render CloudFormation
        run: npm run generate:cloudformation
      - name: Content and link checks
        run: npm run test:content
      - name: SEO and schema checks
        run: npm run test:seo
      - name: Accessibility checks
        run: npm run test:accessibility
      - name: Security checks
        run: npm run test:security
      - name: Production build
        run: npm run build
  deploy:
    if: >
      needs.validate.result == 'success' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      )
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: sozorock-ai-lab-production
      cancel-in-progress: false
    env:
      STACK_NAME: ${{ vars.STACK_NAME || 'sozorock-ai-lab' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::791860731989:role/GitHubActionsSozorockAiLabDeployRole' }}
      EXISTING_RESPONSE_HEADERS_POLICY_ID: ${{ vars.EXISTING_RESPONSE_HEADERS_POLICY_ID || '8f64e954-90e0-49ec-aefb-aae19c5873a8' }}
      SITE_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET }}
      DOMAIN_NAME: ${{ vars.AI_LAB_DOMAIN || 'ai-lab.sozorockfoundation.org' }}
      CERTIFICATE_ARN: ${{ secrets.AWS_ACM_CERTIFICATE_ARN }}
      HOSTED_ZONE_ID: ${{ secrets.AWS_ROUTE53_HOSTED_ZONE_ID }}
      SENDER_EMAIL: ${{ vars.SENDER_EMAIL || 'contact@sozorockfoundation.org' }}
      INTERNAL_NOTIFICATION_EMAIL: ${{ vars.INTERNAL_NOTIFICATION_EMAIL || 'contact@sozorockfoundation.org' }}
      FULL_APPLICATION_URL: ${{ secrets.FULL_APPLICATION_URL }}
      ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN || 'https://ai-lab.sozorockfoundation.org' }}
      APPLICATION_RATE_LIMIT: ${{ vars.APPLICATION_RATE_LIMIT || '5' }}
      APPLICATION_BURST_LIMIT: ${{ vars.APPLICATION_BURST_LIMIT || '10' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate core deployment configuration
        run: |
          test -n "${AWS_ROLE_TO_ASSUME}" || { echo 'AWS_ROLE_TO_ASSUME is missing'; exit 1; }
          test -n "${SITE_BUCKET_NAME}" || { echo 'AWS_S3_BUCKET is missing'; exit 1; }
      - name: Create deployment receipt
        run: |
          printf '{"commit":"%s","run_id":"%s","deployed_at":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > site/deployment.json
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: SozoRockAiLab-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy infrastructure and site
        run: bash scripts/deploy-aws.sh
      - name: Production smoke, CTA, API and security-header test
        run: |
          set -euo pipefail
          base="https://${DOMAIN_NAME}"
          for path in / /curriculum/ /organizations/ /privacy/ /terms/ /cookies/ /acceptable-use/ /responsible-ai/ /accessibility/ /nondiscrimination/ /data-rights/ /security/ /copyright/ /media-consent/ /grievances/ /sitemap.xml /robots.txt /.well-known/security.txt /favicon.ico /deployment.json; do
            echo "Checking route ${path}"
            curl --retry 8 --retry-delay 8 -fsSI "${base}${path}" >/dev/null
          done
          headers="$(curl --retry 8 --retry-delay 8 -fsSI "${base}/")"
          grep -qi '^content-security-policy:' <<<"$headers"
          grep -qi '^strict-transport-security:' <<<"$headers"
          grep -qi '^x-content-type-options: nosniff' <<<"$headers"
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' <<<"$headers"
          grep -qi '^permissions-policy:' <<<"$headers"

          homepage="$(curl --retry 8 --retry-delay 8 -fsS "${base}/")"
          curriculum="$(curl --retry 8 --retry-delay 8 -fsS "${base}/curriculum/")"
          organizations="$(curl --retry 8 --retry-delay 8 -fsS "${base}/organizations/")"
          grep -F 'Practical AI skills for work and community life.' <<<"$homepage" >/dev/null
          grep -F 'SozoRock AI Lab is a no-cost education program of The SozoRock Foundation.' <<<"$homepage" >/dev/null
          grep -F 'Program results will be published as evidence becomes available.' <<<"$homepage" >/dev/null
          grep -F 'href="/organizations/#inquiry"' <<<"$homepage" >/dev/null
          grep -F 'Core learning areas' <<<"$curriculum" >/dev/null
          grep -F 'The curriculum is tool-neutral.' <<<"$curriculum" >/dev/null
          grep -F 'data-application-type="organization-interest"' <<<"$organizations" >/dev/null
          grep -F 'Send organization inquiry' <<<"$organizations" >/dev/null

          for source in "$homepage" "$curriculum" "$organizations"; do
            if grep -Eqi 'href="mailto:|Before we automate|AI Capability Lab|Meridian|Day [0-9]+ of [0-9]+' <<<"$source"; then
              echo 'Primary program page contains an email CTA or removed legacy/product copy.'
              exit 1
            fi
          done

          api_body="$(mktemp)"
          api_status="$(curl --retry 4 --retry-delay 2 -sS -o "$api_body" -w '%{http_code}' \
            -X POST "${base}/api/applications/start" \
            -H "Origin: ${base}" \
            -H 'Content-Type: application/json' \
            --data '{"website":"production-qa-probe"}')"
          echo "Application POST probe status: ${api_status}"
          test "$api_status" = '202'
          grep -F '"ok":true' "$api_body" >/dev/null
          rm -f "$api_body"

          method_status="$(curl --retry 4 --retry-delay 2 -sS -o /dev/null -w '%{http_code}' "${base}/api/applications/start")"
          echo "Undefined GET route status: ${method_status}"
          test "$method_status" = '404'

          curl --retry 8 --retry-delay 8 -fsS "${base}/robots.txt" | grep -F 'Sitemap: https://ai-lab.sozorockfoundation.org/sitemap.xml' >/dev/null
          curl --retry 8 --retry-delay 8 -fsS "${base}/.well-known/security.txt" | grep -F 'Policy: https://ai-lab.sozorockfoundation.org/security/' >/dev/null
          curl --retry 8 --retry-delay 8 -fsS "${base}/deployment.json" | grep -F "\"commit\":\"${GITHUB_SHA}\"" >/dev/null
