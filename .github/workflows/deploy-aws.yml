name: Validate and deploy SozoRock AI Lab to AWS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content and build outputs
        run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      STACK_NAME: ${{ vars.STACK_NAME || 'sozorock-ai-lab' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      SITE_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET }}
      DOMAIN_NAME: ${{ vars.AI_LAB_DOMAIN || 'ai-lab.sozorockfoundation.org' }}
      CERTIFICATE_ARN: ${{ secrets.AWS_ACM_CERTIFICATE_ARN }}
      HOSTED_ZONE_ID: ${{ secrets.AWS_ROUTE53_HOSTED_ZONE_ID }}
      SENDER_EMAIL: ${{ vars.SENDER_EMAIL || 'contact@sozorockfoundation.org' }}
      INTERNAL_NOTIFICATION_EMAIL: ${{ vars.INTERNAL_NOTIFICATION_EMAIL || 'contact@sozorockfoundation.org' }}
      FULL_APPLICATION_URL: ${{ secrets.FULL_APPLICATION_URL }}
      ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}
      ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN || 'https://ai-lab.sozorockfoundation.org' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build, update infrastructure, deploy site, and invalidate CloudFront
        run: bash scripts/deploy-aws.sh

      - name: Smoke test deployed site
        run: |
          set -euo pipefail
          base="https://${DOMAIN_NAME}"
          curl -fsSI "${base}/" >/dev/null
          curl -fsSI "${base}/privacy" >/dev/null
          curl -fsSI "${base}/accessibility" >/dev/null
          curl -fsSI "${base}/nondiscrimination" >/dev/null
          curl -fsSI "${base}/terms" >/dev/null
          curl -fsSI "${base}/sitemap.xml" >/dev/null
          curl -fsSI "${base}/favicon.ico" >/dev/null
          curl -fsS "${base}/" | grep -F "Build useful AI systems for real work." >/dev/null
          curl -fsS "${base}/" | grep -F "Applications are reviewed on a rolling basis." >/dev/null
