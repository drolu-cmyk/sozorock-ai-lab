name: Diagnose AWS deployment credentials
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  diagnose:
    if: github.head_ref == 'agent/diagnose-live-deploy'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      DOMAIN_NAME: ${{ vars.AI_LAB_DOMAIN || 'ai-lab.sozorockfoundation.org' }}
    steps:
      - name: Validate core deployment secrets
        run: |
          test -n "${{ secrets.AWS_ROLE_TO_ASSUME }}" || { echo 'AWS_ROLE_TO_ASSUME is missing'; exit 1; }
          test -n "${{ secrets.AWS_S3_BUCKET }}" || { echo 'AWS_S3_BUCKET is missing'; exit 1; }
          echo 'Core production deployment secrets are configured'
      - name: Configure AWS credentials once
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          disable-retry: true
      - name: Confirm AWS identity and existing stack
        run: |
          aws sts get-caller-identity
          aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name sozorock-ai-lab --query 'Stacks[0].{Status:StackStatus,Outputs:Outputs}' --output json
          echo "domain=${DOMAIN_NAME}"
