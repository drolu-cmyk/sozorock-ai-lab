name: Validate and deploy SozoRock AI Lab to AWS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: sozorock-ai-lab-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      STACK_NAME: ${{ vars.STACK_NAME || 'sozorock-ai-lab' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      SITE_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET }}
      DOMAIN_NAME: ${{ vars.AI_LAB_DOMAIN || 'ai-lab.sozorockfoundation.org' }}
      CERTIFICATE_ARN: ${{ secrets.AWS_ACM_CERTIFICATE_ARN }}
      HOSTED_ZONE_ID: ${{ secrets.AWS_ROUTE53_HOSTED_ZONE_ID }}
      SENDER_EMAIL: ${{ vars.SENDER_EMAIL || 'contact@sozorockfoundation.org' }}
      INTERNAL_NOTIFICATION_EMAIL: ${{ vars.INTERNAL_NOTIFICATION_EMAIL || 'contact@sozorockfoundation.org' }}
      FULL_APPLICATION_URL: ${{ secrets.FULL_APPLICATION_URL }}
      ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN || 'https://ai-lab.sozorockfoundation.org' }}
      APPLICATION_RATE_LIMIT: ${{ vars.APPLICATION_RATE_LIMIT || '5' }}
      APPLICATION_BURST_LIMIT: ${{ vars.APPLICATION_BURST_LIMIT || '10' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/deploy-aws.sh
      - name: Production smoke and security-header test
        run: |
          set -euo pipefail
          base="https://${DOMAIN_NAME}"
          for path in / /privacy/ /terms/ /cookies/ /acceptable-use/ /responsible-ai/ /accessibility/ /nondiscrimination/ /data-rights/ /security/ /copyright/ /media-consent/ /grievances/ /sitemap.xml /robots.txt /.well-known/security.txt /favicon.ico; do curl --retry 5 --retry-delay 5 -fsSI "${base}${path}" >/dev/null; done
          headers="$(curl --retry 5 --retry-delay 5 -fsSI "${base}/")"
          grep -qi '^content-security-policy:' <<<"$headers"
          grep -qi '^strict-transport-security:' <<<"$headers"
          grep -qi '^x-content-type-options: nosniff' <<<"$headers"
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' <<<"$headers"
          grep -qi '^permissions-policy:' <<<"$headers"
          curl -fsS "${base}/" | grep -F 'Use AI for work you already do.' >/dev/null
          curl -fsS "${base}/" | grep -F 'Visit the Foundation website' >/dev/null
          curl -fsS "${base}/" | grep -F 'application/ld+json' >/dev/null
          curl -fsS "${base}/" | grep -F 'twitter:card' >/dev/null
          curl -fsS "${base}/robots.txt" | grep -F 'Sitemap: https://ai-lab.sozorockfoundation.org/sitemap.xml' >/dev/null
          curl -fsS "${base}/.well-known/security.txt" | grep -F 'Policy: https://ai-lab.sozorockfoundation.org/security/' >/dev/null
